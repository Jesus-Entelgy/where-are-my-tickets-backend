services:

  postgres:

    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

    ports:
      - "${DB_HOST_PORT:?Set DB_HOST_PORT in .env}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      args:
        PORT: ${PORT:?Set PORT in .env}
    container_name: nestjs-api
    restart: unless-stopped
    ports:
      - "${PORT:?Set PORT in .env}:${PORT:?Set PORT in .env}"
    env_file:
      - .env
    depends_on:
      - postgres

volumes:
  postgres_data:
services:

  postgres:

    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

    ports:
      - "${DB_HOST_PORT:?Set DB_HOST_PORT in the selected env file}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${APP_HOST_PORT:?Set APP_HOST_PORT in the selected env file}:3000"
    env_file:
      - .env.${APP_ENV:?Set APP_ENV in the selected env file}
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      - postgres

volumes:
  postgres_data: